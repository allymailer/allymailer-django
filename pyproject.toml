[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allymailer-django"
version = "1.1.2"
description = "AllyMailer Web API for Django: API client, email backend, webhooks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AllyMailer" }]
keywords = ["allymailer", "django", "email", "webhook"]
classifiers = ["Framework :: Django"]
dependencies = ["allymailer-python-sdk>=1.1.2", "Django>=4.2"]

[project.urls]
Homepage = "https://github.com/allymailer/allymailer-django"
Documentation = "https://docs.allymailer.com.ua/ua/web-api-ref"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
